# //Pranjal Das
name: Sentinel+ Autonomous Infrastructure & Code Sentry Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sentry-audit:
    name: Deterministic Kernel & AST Audit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Check out source repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🧪 Execute 100% Deterministic Unit & Mesh Test Suite
        env:
          PYTHONPATH: ./:./packages
          SENTINEL_SIMULATED_BEDROCK: "1"
        run: |
          pytest -v --tb=short tests/

      - name: 🔍 Run Sentinel+ Kernel Port Sentry Audit (CLI Check)
        env:
          PYTHONPATH: ./:./packages
        run: |
          python -m src.cli --check --ports 3000,5173,8000,8080

      - name: 🛡️ Run Multi-Agent AST Codebase & CWE-404 Inspection
        env:
          PYTHONPATH: ./:./packages
        run: |
          python -m src.cli --audit-repo --json > audit_session.json
          cat audit_session.json

      - name: 📊 Enforce Zero-Leak & Safety Invariants Gate
        run: |
          python -c "
          import json, sys
          with open('audit_session.json') as f:
              data = json.load(f)
          critic = data.get('critic_verdict', {})
          status = data.get('status', '')
          risk = critic.get('risk_score', 1.0)
          print(f'Audit Status: {status} | Risk Score: {risk}')
          if risk > 0.90:
              print('🚨 CI FAILED: Critical infrastructure risk or unclosed socket defect detected.')
              sys.exit(1)
          print('✅ CI PASSED: All Sentinel+ safety and socket invariants satisfied.')
          "
